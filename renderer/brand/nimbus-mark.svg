<!--
  Simplified mark for small sizes.

  The full logo's four curls turn to mush below about 24px, so the pill uses
  this: the same silhouette, one curl, heavier stroke. Legibility beats fidelity
  at 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 18.5
             C 4 18.5, 2 16.3, 2 13.5
             C 2 11.1, 3.7 9.2, 6 9
             C 6 6.2, 8.2 4, 11 4
             C 12.9 4, 14.6 5.1, 15.4 6.7
             C 16.4 5.6, 18 5.2, 19.4 5.9
             C 20.9 6.7, 21.6 8.4, 21.2 10
             C 22.3 11, 22.9 12.4, 22.6 13.9
             C 22.2 16.6, 19.9 18.5, 17.2 18.5
             Z" />
    <path d="M14.6 11.6
             C 14.6 14.4, 12.6 16.4, 10 16.4
             C 8.4 16.4, 7.2 15.2, 7.2 13.8
             C 7.2 12.6, 8.1 11.7, 9.3 11.9" />
  </g>
</svg>
